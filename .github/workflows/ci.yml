name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the two repositories.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            run: ""
            php-build: .php-build
          - name: linux-x86_64-musl
            os: ubuntu-latest
            run: scripts/linux.sh
            php-build: .php-build-linux
    runs-on: ${{ matrix.os }}
    env:
      # crates/speedyspec-cli/build.rs embeds the PHP contracts from this checkout;
      # scripts/linux.sh mounts it into its container.
      SPEEDYSPEC_CONTRACTS_DIR: ${{ github.workspace }}/speedyspec-cli-contracts
    defaults:
      run:
        working-directory: speedyspec-cli
    steps:
      # Both repositories side by side, as in local development.
      - uses: actions/checkout@v4
        with:
          path: speedyspec-cli

      - uses: actions/checkout@v4
        with:
          repository: SpeedySpec/speedyspec-cli-contracts
          path: speedyspec-cli-contracts

      - name: Install Rust 1.99
        if: matrix.run == ''
        run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99

      - name: Cache static PHP
        uses: actions/cache@v4
        with:
          # Paths and hashFiles are relative to the workspace, not the working directory.
          path: |
            speedyspec-cli/${{ matrix.php-build }}/spc
            speedyspec-cli/${{ matrix.php-build }}/buildroot
          key: php-${{ matrix.name }}-${{ hashFiles('speedyspec-cli/php-version', 'speedyspec-cli/scripts/build-php.sh') }}

      - name: Build static PHP
        # Runners are throwaway, so spc may install missing build tools.
        env:
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
          # spc looks up source releases through the GitHub API; unauthenticated calls from
          # shared runners are rate limited (HTTP 403). The read-only workflow token is enough.
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ matrix.run }} scripts/build-php.sh

      - name: Test
        run: ${{ matrix.run }} cargo test --workspace

  kubernetes-e2e:
    name: kubernetes end to end (k3s)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speedyspec-cli
    steps:
      # Both repositories side by side, as in local development.
      - uses: actions/checkout@v4
        with:
          path: speedyspec-cli

      - uses: actions/checkout@v4
        with:
          repository: SpeedySpec/speedyspec-cli-contracts
          path: speedyspec-cli-contracts

      - name: Install Rust 1.99
        run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99

      # A throwaway single-node cluster in a container on the runner; nothing else is contacted.
      - name: Start k3s
        run: scripts/k3s.sh up

      # The driver crate has no PHP dependency, so this job builds no static PHP.
      - name: Test against the cluster
        env:
          SPEEDYSPEC_E2E_KUBECONFIG: ${{ github.workspace }}/speedyspec-cli/.k3s/kubeconfig
        run: cargo test -p speedyspec-driver-kubernetes --test e2e -- --ignored --test-threads=1

      - name: Stop k3s
        if: always()
        run: scripts/k3s.sh down
