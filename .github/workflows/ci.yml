name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the two repositories.
permissions:
  contents: read

jobs:
  # Every target is built, tested and smoke-run on every change, exactly as a release is.
  build:
    uses: ./.github/workflows/build.yml

  kubernetes-e2e:
    name: kubernetes end to end (k3s)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speedyspec-cli
    steps:
      - uses: actions/checkout@v4
        with:
          path: speedyspec-cli

      - name: Install Rust 1.99
        run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99

      # A throwaway single-node cluster in a container on the runner; nothing else is contacted.
      - name: Start k3s
        run: scripts/k3s.sh up

      # The driver crate has no PHP dependency, so this job builds no static PHP.
      - name: Test against the cluster
        env:
          SPEEDYSPEC_E2E_KUBECONFIG: ${{ github.workspace }}/speedyspec-cli/.k3s/kubeconfig
        run: cargo test -p speedyspec-driver-kubernetes --test e2e -- --ignored --test-threads=1

      - name: Stop k3s
        if: always()
        run: scripts/k3s.sh down

  database:
    name: database (MySQL 8.4, MariaDB 11.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speedyspec-cli
    steps:
      - uses: actions/checkout@v4
        with:
          path: speedyspec-cli

      - name: Install Rust 1.99
        run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99

      # Throwaway servers in containers on the runner, on loopback; nothing else is contacted.
      - name: Start MySQL and MariaDB
        run: scripts/mysql.sh up

      # speedyspec-db has no PHP dependency, so this job builds no static PHP.
      - name: Test against both servers
        run: |
          eval "$(scripts/mysql.sh env)"
          cargo test -p speedyspec-db --test mysql -- --ignored --test-threads=1

      - name: Stop MySQL and MariaDB
        if: always()
        run: scripts/mysql.sh down
