# speedyspec-php (from crates.io) links the static PHP at SPEEDYSPEC_PHP_PREFIX,
# which it requires, and ext-php-rs's build script finds PHP through PHP and
# PHP_CONFIG before it looks on PATH. Point them all at the static build so the
# system PHP is never used. A variable already set in the environment wins
# (scripts/linux.sh and CI rely on the defaults; set SPEEDYSPEC_PHP_PREFIX, PHP,
# PHP_CONFIG and SODIUM_LIB_DIR together if you move the build).
[env]
SPEEDYSPEC_PHP_PREFIX = { value = ".php-build/buildroot", relative = true }
PHP = { value = ".php-build/buildroot/bin/php", relative = true }
PHP_CONFIG = { value = ".php-build/buildroot/bin/php-config", relative = true }
# The oldest macOS the binary runs on: what the static PHP is built for too
# (scripts/build-php.sh), so nothing linked in demands a newer one. Ignored off macOS.
MACOSX_DEPLOYMENT_TARGET = "12.0"
# speedyspec-php requires this to be the static PHP's own lib/, so anything
# linking libsodium beside PHP links PHP's libsodium.a (the 1.0.22 that
# scripts/build-php.sh pins), never a second copy.
SODIUM_LIB_DIR = { value = ".php-build/buildroot/lib", relative = true }
