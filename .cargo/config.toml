# ext-php-rs's build script finds PHP through these variables before it looks
# on PATH. Point them at the static build so the system PHP is never used.
# A variable already set in the environment wins (scripts/linux.sh and CI rely
# on the defaults; set all three together if you move the build).
[env]
PHP = { value = ".php-build/buildroot/bin/php", relative = true }
PHP_CONFIG = { value = ".php-build/buildroot/bin/php-config", relative = true }
