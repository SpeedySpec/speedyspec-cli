[package]
name = "speedyspec-cli"
version = "0.1.0"
description = "The speedyspec command line: a statically linked PHP interpreter that PHP plugins extend."
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "speedyspec"
path = "src/main.rs"

[dependencies]
speedyspec-driver = { path = "../speedyspec-driver" }
speedyspec-backup = { path = "../speedyspec-backup" }
speedyspec-composer = { path = "../speedyspec-composer" }
speedyspec-driver-zip = { path = "../speedyspec-driver-zip" }
speedyspec-db = { path = "../speedyspec-db" }
speedyspec-fetch = { path = "../speedyspec-fetch" }
speedyspec-selfupdate = { path = "../speedyspec-selfupdate" }
speedyspec-driver-kubernetes = { path = "../speedyspec-driver-kubernetes" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-php-ext = { path = "../speedyspec-php-ext" }
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-hooks-php = { path = "../speedyspec-wp-hooks-php" }
speedyspec-plugin = { path = "../speedyspec-plugin" }
# The command tree is built at run time from what plugins contribute, so the
# builder API is used; `string` lets plugin-supplied names become clap ids.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
semver = "1"
# Reads a secret from the terminal without echoing it.
rpassword = "7"
# Reads the GitHub release description when installing a plugin from owner/repo.
serde_json = "1"
tempfile = "3"
# The runner binary's SHA-256, checked again in the runner pod.
sha2 = "0.11"
# Process groups and signals for the runner's child.
libc = "0.2"

[build-dependencies]
semver = "1"
serde_json = "1"

[dev-dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", features = ["conformance"] }
tempfile = "3"
speedyspec-testkit = { path = "../speedyspec-testkit" }
sha2 = "0.11"
# The database tests make their own databases and users.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
flate2 = "1"
tar = "0.4"
