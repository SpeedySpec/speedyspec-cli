[package]
name = "speedyspec-plugin"
version = "0.1.0"
description = "Plugin discovery, manifest validation and loading for speedyspec. No PHP dependency."
edition.workspace = true
rust-version.workspace = true

[dependencies]
dirs = "6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
