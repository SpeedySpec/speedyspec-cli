[package]
name = "speedyspec-composer"
version = "0.1.0"
description = "speedyspec's composer, in Rust: installs a composer.lock's packages and builds their autoload maps."
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
speedyspec-driver-zip = { path = "../speedyspec-driver-zip" }

[dev-dependencies]
speedyspec-testkit = { path = "../speedyspec-testkit" }
