[package]
name = "speedyspec-selfupdate"
version = "0.1.0"
description = "Finding, verifying and swapping in a newer speedyspec binary."
edition.workspace = true
rust-version.workspace = true

[dependencies]
speedyspec-fetch = { path = "../speedyspec-fetch" }
semver = "1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[dev-dependencies]
speedyspec-testkit = { path = "../speedyspec-testkit" }
