[package]
name = "speedyspec-driver-kubernetes"
version = "0.1.0"
description = "The speedyspec Kubernetes driver: applies the resources a plugin returns, waits for them and records the install."
edition.workspace = true
rust-version.workspace = true

[dependencies]
speedyspec-driver = { path = "../speedyspec-driver" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
# rustls with ring: nothing from the system, so the binary stays static. ws: exec, for the runner pod.
kube = { version = "5", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
# Only to run the client: a current-thread runtime that never leaves this crate.
tokio = { version = "1", features = ["rt", "time", "io-util", "sync", "macros"] }
serde_json = "1"
# The API server returns Secret data base64-encoded.
base64 = "0.22"

[dev-dependencies]
# The end-to-end test plays another field manager with the client directly.
kube = { version = "5", default-features = false, features = ["client", "rustls-tls", "ring"] }
tokio = { version = "1", features = ["rt", "time"] }
speedyspec-testkit = { path = "../speedyspec-testkit" }
tempfile = "3"
