[package]
name = "speedyspec-backup"
version = "0.1.0"
description = "speedyspec's backups: the archive, and moving a site to a new URL and table prefix, in Rust."
edition.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1"
serde_json = "1"
speedyspec-driver = { path = "../speedyspec-driver" }
tar = "0.4"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "php"
harness = false

[[test]]
name = "memory"
harness = false
